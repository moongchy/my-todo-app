name: Build Mac App ASCII Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.12.0 pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7 Pillow==12.3.0
      - name: Convert existing icon
        run: |
          python - <<'PY'
          from PIL import Image
          with Image.open("todo.ico") as icon:
              icon.convert("RGBA").save("todo.icns", format="ICNS")
          PY
      - name: Build app
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onedir \
            --icon todo.icns --osx-bundle-identifier com.moongchy.myhomework --name "MyHomework_v1_2" todo_app_v25_7_calendar.py
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/MyHomework_v1_2.app"
          python - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path("dist/MyHomework_v1_2.app/Contents")
          info = plistlib.loads((app / "Info.plist").read_bytes())
          name = info["CFBundleIconFile"]
          assert (app / "Resources" / name).is_file(), name
          PY
      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/MyHomework_v1_2.app" "MyHomework-mac.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: MyHomework-${{ matrix.os }}
          path: MyHomework-mac.zip
          if-no-files-found: error

      - name: Collect signing diagnostics
        if: failure()
        run: |
          mkdir -p signing-diagnostics
          sw_vers > signing-diagnostics/system.txt
          python -m pip freeze > signing-diagnostics/packages.txt
          if [ -f "dist/MyHomework_v1_2.app/Contents/Info.plist" ]; then
            cp "dist/MyHomework_v1_2.app/Contents/Info.plist" signing-diagnostics/Info.plist
            codesign -d --verbose=4 "dist/MyHomework_v1_2.app" > signing-diagnostics/signature.txt 2>&1 || true
            find "dist/MyHomework_v1_2.app" -name CodeResources -print > signing-diagnostics/resource-seals.txt
          fi
          python - <<'PY'
          from pathlib import Path
          import shutil
          target = Path("signing-diagnostics")
          for folder in (Path.home()/"Library/Logs/DiagnosticReports", Path("/Library/Logs/DiagnosticReports")):
              for p in folder.glob("codesign*"):
                  if p.is_file():
                      shutil.copy2(p, target / p.name)
          PY
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: signing-diagnostics-${{ matrix.os }}
          path: signing-diagnostics/
