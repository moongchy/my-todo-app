name: Build Mac App v2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: AppleSilicon
          - os: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.12.0 pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7 Pillow==12.3.0
      - name: Check source and convert icon
        run: |
          python -m py_compile todo_app_v2_16.py
          python - <<'PY'
          from PIL import Image
          with Image.open('todo.ico') as image:
              image.convert('RGBA').save('todo.icns', format='ICNS')
          PY
      - name: Build app
        run: python -m PyInstaller --clean --noconfirm mac_v2.spec
      - name: Name and verify app
        run: |
          mv 'dist/MyHomework_v2_0.app' 'dist/나만의 숙제 v2.0.app'
          codesign --verify --deep --strict --verbose=2 'dist/나만의 숙제 v2.0.app'
          python - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('dist/나만의 숙제 v2.0.app/Contents')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleShortVersionString'] == '2.0.0'
          assert (app / 'Resources' / info['CFBundleIconFile']).is_file()
          PY
      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/나만의 숙제 v2.0.app' 'MyHomework-v2.0-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: MyHomework-v2.0-${{ matrix.arch }}
          path: MyHomework-v2.0-${{ matrix.arch }}.zip
          if-no-files-found: error
