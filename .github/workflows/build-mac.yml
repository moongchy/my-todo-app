name: Build Mac App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PyQt6 pyinstaller Pillow

      - name: Convert icon
        run: |
          python - <<'PY'
          from PIL import Image
          with Image.open("todo.ico") as icon:
              icon.convert("RGBA").save("todo.icns", format="ICNS")
          PY

      - name: Build app
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onedir \
            --icon todo.icns \
            --name "나만의 숙제 v1.2" todo_app_v25_7_calendar.py

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 "dist/나만의 숙제 v1.2.app"

      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/나만의 숙제 v1.2.app" "MyHomework-mac.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: MyHomework-${{ matrix.os }}
          path: MyHomework-mac.zip
          if-no-files-found: error
