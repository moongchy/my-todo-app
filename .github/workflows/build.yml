name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6

    - name: Build EXE (Folder mode to avoid antivirus false-positive)
      run: |
        pyinstaller --noconsole --onedir --name "TodoApp" todo_app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TodoApp-Windows-Package
        path: dist/TodoApp
